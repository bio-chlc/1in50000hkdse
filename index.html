      margin: 0;
      padding: 0;
    }

    body {

      font-family: var(--font-sans);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(246, 245, 240, 0.94);

      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    .brand span {
      font-family: var(--font-sans);
      font-size: 0.78rem;
      color: var(--muted);
      font-weight: normal;
      margin-left: 8px;
    }

      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-pill strong {
      font-variant-numeric: tabular-nums;
    }

    .container {
      max-width: 800px;
      margin: 28px auto;
      padding: 0 20px;
    }

    .hero-card, .event-card, .pause-card, .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      animation: fadeIn 0.35s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      font-weight: normal;
      margin-bottom: 10px;
      line-height: 1.25;
    }

      font-size: 1.35rem;
      font-weight: normal;
      margin-bottom: 12px;
    }

      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 10px;
      margin-top: 16px;

      color: #2c2b28;
    }

    .small-muted {
      font-size: 0.85rem;
      color: var(--muted);
    }

      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 20px 0;
    }

        grid-template-columns: 1fr !important;
      }
    }

    .toggle-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      background: #faf9f5;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-box.active {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .toggle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-on {
      background: var(--accent);
      color: #fff;
    }

    .badge-off {
      background: #dcd9d0;
      color: #444;
    }

    .badge-theory {
      background: var(--gold-soft);
      color: var(--gold);
      border: 1px solid #e6d8a7;

    .btn {

      color: #fff;
      border: none;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      text-align: center;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn:disabled {
      background: #b5b2a8;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #efede6;
    }

      margin-top: 16px;

      border-radius: 8px;

      font-size: 0.95rem;

      color: var(--warn);
      background: var(--warn-soft);
      padding: 1px 6px;
      border-radius: 4px;
      margin-top: 4px;

      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 12px 0 18px 0;

function calcSubjectCongruency(profileCode, subj) {
  let score = 0;
  const p1 = profileCode[0], p2 = profileCode[1], p3 = profileCode[2];
  if (subj.primary === p1) score += 3;
  else if (subj.primary === p2) score += 2;
  else if (subj.primary === p3) score += 1;

  if (subj.secondary === p1 || subj.secondary === p2 || subj.secondary === p3) {
    score += 1;
  }
  return score; // 0 to 4
}

  const base = profile.coreBase[coreKey];
  if (base >= 65) return "High Natural Fit";
  if (base >= 48) return "Moderate Fit";
  return "Low Fit (Needs Hardworking Effort)";
}

function getTotalCongruency() {
  if (!state.profile || state.selectedElectives.length === 0) return 0;
  return state.selectedElectives.reduce((acc, id) => {
    const s = SUBJECTS.find(x => x.id === id);
    return acc + calcSubjectCongruency(state.profile.code, s);
  }, 0);
}

function toggleElectiveSelection(subjId) {
  const subj = SUBJECTS.find(x => x.id === subjId);
  const isSel = state.selectedElectives.includes(subjId);

  if (isSel) {
    state.selectedElectives = state.selectedElectives.filter(x => x !== subjId);
    return;
  }

  // Check if a mutually exclusive sibling is already selected
  if (subj.mutex) {
    const conflictId = state.selectedElectives.find(existingId => {
      const ex = SUBJECTS.find(s => s.id === existingId);
      return ex && ex.mutex === subj.mutex;
    });
    if (conflictId) {
      // Replace the mutually exclusive sibling directly
      const idx = state.selectedElectives.indexOf(conflictId);
      state.selectedElectives[idx] = subjId;
      return;
    }
  }

  if (state.selectedElectives.length < 3) {
    state.selectedElectives.push(subjId);
  }
}

function syncElectiveMasteryDictionary() {
  const p = state.profile;
  const updated = {};
  state.selectedElectives.forEach(id => {
    if (typeof state.subjectMastery[id] === "number") {
      updated[id] = state.subjectMastery[id];
    } else {
      const s = SUBJECTS.find(x => x.id === id);
      const c = calcSubjectCongruency(p.code, s);
      updated[id] = 46 + c * 4;
    }
  });
  state.subjectMastery = updated;
}

function updateHeader() {
  const bar = document.getElementById("statusBar");
  if (state.step === "START") {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "flex";
  document.getElementById("statForm").textContent = state.step;
  document.getElementById("statCode").textContent = state.revealCode ? state.profile.code : "??? (Hidden)";
  const maxC = state.selectedElectives.length * 4;
  document.getElementById("statCongruency").textContent =
    state.selectedElectives.length > 0
      ? (state.revealCode ? `${getTotalCongruency()}/${maxC}` : "Hidden")
      : "-";
  document.getElementById("statEngagement").textContent = Math.round(state.engagement);
  document.getElementById("statWellbeing").textContent = Math.round(state.wellbeing);
}

function render() {
  updateHeader();
  const root = document.getElementById("gameRoot");
  root.innerHTML = "";

  if (state.step === "START") renderStart(root);
  else if (state.step === "S3_PROFILE") renderS3Profile(root);
  else if (state.step === "S3_NEGOTIATION") renderNegotiation(root);
  else if (state.step === "S3_PARTICIPATION") renderParticipation(root);
  else if (state.step === "S3_EVALUATION") renderEvaluation(root);
  else if (state.step === "S4") renderS4(root);
  else if (state.step === "S5_DROP") renderS5Drop(root);
  else if (state.step === "S5") renderS5(root);
  else if (state.step === "S6") renderS6(root);
  else if (state.step === "SUMMARY") renderSummary(root);

  window.scrollTo({ top: 0, behavior: "smooth" });
}

function getLowestFitSelectedSubject() {
  let worst = null;
  let minScore = 99;
  state.selectedElectives.forEach(id => {
    const s = SUBJECTS.find(x => x.id === id);
    const c = calcSubjectCongruency(state.profile.code, s);
    if (c < minScore) {
      minScore = c;
      worst = s;
    }
  });
  return { subject: worst, score: minScore };
}

function getBestUnselectedSubject(replacingSubj) {
  let best = null;
  let maxScore = -1;
  SUBJECTS.forEach(s => {
    if (!state.selectedElectives.includes(s.id)) {
      const remainingIds = state.selectedElectives.filter(id => !replacingSubj || id !== replacingSubj.id);
      const hasMutexConflict = s.mutex && remainingIds.some(remId => {
        const remSubj = SUBJECTS.find(x => x.id === remId);
        return remSubj && remSubj.mutex === s.mutex;
      });
      if (!hasMutexConflict) {
        const c = calcSubjectCongruency(state.profile.code, s);
        if (c > maxScore) {
          maxScore = c;
          best = s;
        }
      }
    }
  });
  return { subject: best, score: maxScore };
}

    const val = Math.round(state.subjectMastery[id] || 50);
    const c = calcSubjectCongruency(p.code, s);
    return `
      <div class="meter-row">
        <span><strong>${s.name.split("(")[0]}</strong> ${state.revealCode ? `(${c}/4)` : ""}</span>
        <div class="meter-bar"><div class="meter-fill" style="width:${Math.min(100, Math.max(0, val))}%"></div></div>
        <span>${val}%</span>
      </div>
    `;
  }).join("");

  return `<div style="margin-bottom:10px;">${coreRows}</div><div>${elecRows}</div>`;
}

function applyCoreProgress(effortLevel) {
  if (effortLevel === "HIGH") state.hardworkingScore += 2;
  else if (effortLevel === "MODERATE") state.hardworkingScore += 1;

  if (state.studyBiasMode === "CORE") state.coreBiasScore += 2;
  else if (state.studyBiasMode === "BALANCED") state.coreBiasScore += 1;

  const biasMult = state.studyBiasMode === "CORE" ? 6.5 : (state.studyBiasMode === "BALANCED" ? 3.5 : 0.5);
  const effortMult = effortLevel === "HIGH" ? 4.5 : (effortLevel === "MODERATE" ? 2.0 : -1.5);
  const engBonus = (state.engagement - 50) * 0.06;

  ["chi", "eng", "math"].forEach(k => {
    const fitDrift = (state.profile.coreBase[k] - 50) * 0.08;
    const totalDelta = fitDrift + biasMult + effortMult + engBonus;
    state.coreMastery[k] = Math.max(20, Math.min(96, state.coreMastery[k] + totalDelta));
  });
}

function scoreToDSEGrade(score) {
  if (score >= 88) return { grade: "5**", points: 7 };
  if (score >= 80) return { grade: "5*", points: 6 };
  if (score >= 72) return { grade: "5", points: 5 };
  if (score >= 62) return { grade: "4", points: 4 };
  if (score >= 50) return { grade: "3", points: 3 };
  if (score >= 38) return { grade: "2", points: 2 };
  return { grade: "1", points: 1 };
}

function renderSummary(root) {
  const p = state.profile;

  const isHardworking = state.hardworkingScore >= 4;
  const isCoreFocused = state.coreBiasScore >= 3;

  const computeFinalCoreScore = (key) => {
    let raw = state.coreMastery[key] + (state.wellbeing - 55) * 0.08;
    if (isHardworking && isCoreFocused) {
      raw = Math.max(raw, 51); // Guarantees at least Level 3
    } else if (isHardworking || isCoreFocused) {
      raw = Math.max(raw, 40); // Guarantees at least Level 2 (HKDSE Pass)
    }
    return Math.min(96, Math.max(22, raw));
  };

  const chiScore = computeFinalCoreScore("chi");
  const engScore = computeFinalCoreScore("eng");
  const mathScore = computeFinalCoreScore("math");

  const chiGrade = scoreToDSEGrade(chiScore);
  const engGrade = scoreToDSEGrade(engScore);
  const mathGrade = scoreToDSEGrade(mathScore);

  const allGrades = [
    { name: "Core: Chinese Language", code: "A/S/C", cong: calcCoreCongruencyLabel(p, "chi"), ...chiGrade },
    { name: "Core: English Language", code: "A/E/S", cong: calcCoreCongruencyLabel(p, "eng"), ...engGrade },
    { name: "Core: Mathematics (Compulsory)", code: "I/C/R", cong: calcCoreCongruencyLabel(p, "math"), ...mathGrade },
    { name: "Core: Citizenship & Social Dev.", code: "Core", cong: "Core", grade: "Attained", points: 0 }
  ];

  state.selectedElectives.forEach(id => {
    const s = SUBJECTS.find(x => x.id === id);
    const c = calcSubjectCongruency(p.code, s);
    let finalM = state.subjectMastery[id] + (state.wellbeing - 55) * 0.1;
    if (isHardworking && state.studyBiasMode !== "CORE") {
      finalM = Math.max(finalM, 40);
    }
    const g = scoreToDSEGrade(finalM);
    allGrades.push({
      name: `Elective: ${s.name}`,
      code: `${s.primary}${s.secondary}`,
      cong: `${c}/4`,
      ...g
    });
  });

  const pointList = allGrades.filter(x => x.points > 0).map(x => x.points).sort((a, b) => b - a);
  const best5 = pointList.slice(0, 5).reduce((a, b) => a + b, 0);

  const meets332A = chiGrade.points >= 3 && engGrade.points >= 3 && mathGrade.points >= 2;
  const meets22222 = pointList.slice(0, 5).every(pt => pt >= 2);

  let jupasOutcome = "";
  if (meets332A && best5 >= 26) {

    jupasOutcome = "JUPAS UGC-Funded Degree Offer — Solid Local University Placement aligned with developed strengths";
  } else if (!meets332A && best5 >= 20) {
    jupasOutcome = "High Elective Score but Missed '332A' Core University Minimum — Eligible for Sub-Degree / Overseas / Conditional Articulation";
  } else if (meets22222 && best5 >= 14) {
    jupasOutcome = "Sub-Degree / Higher Diploma Pathway (Met 5-Subject Level 2+ Pass) — Eligible for Associate Degree or specialized Higher Diploma";
  } else {
    jupasOutcome = "Diploma of Applied Education / Workplace Transition — Low P–E congruence or insufficient Core effort resulted in Core/Elective shortfalls";
  }

  const card = document.createElement("div");
  card.className = "summary-card";
  card.innerHTML = `
    <div class="year-stamp">HKDSE Results Release Day · 1 in 50,000 Life Record</div>
    <h2>Secondary School Life Card: ${p.name}</h2>
    <p><strong>Revealed True Holland Code:</strong> <span style="font-family:monospace; font-size:1.1rem; font-weight:bold;">${p.code}</span> (${p.codeDesc})</p>
    <p><strong>Experimental Setup:</strong> Holland Code ${state.revealCode ? "Revealed" : "Hidden (Blind Mode)"} · Neufeld Tripartite Engagement Cycle ${state.enableNeufeld ? "ENABLED" : "DISABLED (Static Fit Mode)"}</p>

    <div class="life-memorial">
      <h3>Official HKDSE Examination Results Slip</h3>
      <table class="dse-table">
        <thead>
          <tr>
            <th>Subject</th>
            <th>Domain / Code</th>
            <th>Student Fit</th>
            <th>HKDSE Level</th>
          </tr>
        </thead>
        <tbody>
          ${allGrades.map(g => `
            <tr>
              <td><strong>${g.name}</strong></td>
              <td><code>${g.code}</code></td>
              <td>${g.cong}</td>
              <td><strong>${g.grade}</strong></td>
            </tr>
          `).join("")}
          ${state.droppedSubject ? `
            <tr style="color:var(--warn);">
              <td><em>Dropped in S5: ${state.droppedSubject.name}</em></td>
              <td><code>${state.droppedSubject.primary}${state.droppedSubject.secondary}</code></td>
              <td>${calcSubjectCongruency(p.code, state.droppedSubject)}/4</td>
              <td><em>Withdrawn (S5)</em></td>
            </tr>
          ` : ""}
        </tbody>
      </table>

      <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-top:16px; padding-top:12px; border-top:1px solid var(--border);">
        <div><strong>Best 5 HKDSE Score:</strong> ${best5} / 35 pts</div>
        <div><strong>Core '332A' University Requirement:</strong> ${meets332A ? "✅ Met" : "❌ Not Met"}</div>
        <div><strong>Final Engagement:</strong> ${Math.round(state.engagement)} / 100</div>
        <div><strong>Well-being:</strong> ${Math.round(state.wellbeing)} / 100</div>
      </div>
      <p style="margin-top:12px; margin-bottom:0;"><strong>Post-Secondary Pathway:</strong> ${jupasOutcome}</p>
    </div>

    <h3 style="margin-top:24px;">Theoretical Debriefing for Presentation (Walsh, 1989 & Neufeld et al., 2006)</h3>
    <div class="log-entry">
      <p><strong>1. Holland's Congruency Across Electives & Cores (Walsh, 1989):</strong> Your final elective combination achieved a RIASEC congruency of <strong>${getTotalCongruency()}/${state.selectedElectives.length * 4}</strong>. Moreover, Core Chinese, English, and Mathematics grades reflected both ${p.name}'s baseline profile fit and whether sufficient hardworking effort was invested to secure a pass.</p>
      <p><strong>2. Neufeld et al.'s (2006) Tripartite Engagement Cycle:</strong> ${state.enableNeufeld ? "By engaging in <em>Negotiation</em> (teacher/parent accommodation), <em>Participation</em> (S3 tasting classes), and <em>Evaluation</em> (bidirectional appraisal & full pre-S4 subject adjustment), you dynamically mediated the P–E interaction rather than treating fit as static." : "Because the Tripartite Engagement Cycle was turned OFF, static S3 misfit or environmental stressors went unnegotiated—illustrating what Neufeld et al. (2006) term 'environmental neglect'."}</p>
      ${state.droppedSubject ? `<p><strong>3. S5 Attrition Mechanic:</strong> ${state.dropReason}</p>` : ""}
    </div>

    <h3>Chronological Life Log</h3>
    ${state.logs.map(l => `<div class="log-entry"><strong>${l.phase}:</strong> ${l.text}</div>`).join("")}

    <div style="margin-top:24px; display:flex; gap:12px; flex-wrap:wrap;">
      <button class="btn" id="btnReplaySame">Replay Same Student (Compare Toggle Conditions)</button>
      <button class="btn btn-secondary" id="btnNewStudent">Return to Title Screen (Draw Another Random Student)</button>
    </div>
  `;
  root.appendChild(card);

  document.getElementById("btnReplaySame").onclick = () => {
    startNewLife(state.profile);
  };
  document.getElementById("btnNewStudent").onclick = () => {
    state.step = "START";
    render();
  };
}

render();
</script>
</body>
</html>
